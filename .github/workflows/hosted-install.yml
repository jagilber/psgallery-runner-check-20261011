name: Hosted PowerShell Gallery check
on:
  workflow_dispatch:
    inputs:
      debug:
        description: Enable Debug and Verbose on installation and import
        type: boolean
        default: false
      platform:
        description: Hosted platforms to test
        type: choice
        default: both
        options: [both, macos, linux]
permissions: {}
concurrency:
  group: hosted-gallery-check
  cancel-in-progress: false
jobs:
  install:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-26-intel"]' || inputs.platform == 'linux' && '["ubuntu-26.04"]' || '["ubuntu-26.04","macos-26-intel"]') }}
        manager: [PowerShellGet, PSResourceGet]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 95
    env:
      PACKAGE_MANAGER: ${{ matrix.manager }}
      REQUESTED_IMAGE: ${{ matrix.os }}
      AZ_VERSION: 16.4.0
      ENABLE_DIAGNOSTICS: ${{ inputs.debug }}
      LAB_HOME: ${{ runner.temp }}/gallery-home
      LAB_RESULTS: ${{ runner.temp }}/gallery-results
      PWSH_PATH: ${{ runner.temp }}/pwsh-7.6.6/pwsh
    steps:
      - name: Get synthetic lab fixture
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify supervisor guards
        shell: bash
        run: node test-supervisor.mjs
      - name: Prepare verified PowerShell 7.6.6
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          mkdir -p "$RUNNER_TEMP/pwsh-7.6.6" "$RUNNER_TEMP/gallery-results"
          if [ "$RUNNER_OS" = macOS ]; then
            asset=powershell-7.6.6-osx-x64.tar.gz
            expected=e325ed9f666894eb39a5ea52800b602da2fb4242bbe9747ceddb39cdc66de805
          else
            asset=powershell-7.6.6-linux-x64.tar.gz
            expected=ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc
          fi
          curl --fail --location --connect-timeout 20 --max-time 180 --max-filesize 104857600 \
            --output "$RUNNER_TEMP/pwsh.tar.gz" \
            "https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/$asset"
          actual=$(shasum -a 256 "$RUNNER_TEMP/pwsh.tar.gz" | cut -d ' ' -f 1)
          test "$actual" = "$expected"
          tar -xzf "$RUNNER_TEMP/pwsh.tar.gz" -C "$RUNNER_TEMP/pwsh-7.6.6"
          chmod +x "$RUNNER_TEMP/pwsh-7.6.6/pwsh"
          "$RUNNER_TEMP/pwsh-7.6.6/pwsh" --version
      - name: Install and import pinned Az with selected diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          ulimit -f 524288
          exec node supervise.mjs
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: result-${{ matrix.os }}-${{ matrix.manager }}-debug-${{ inputs.debug }}
          path: ${{ runner.temp }}/gallery-results/
          retention-days: 2
          if-no-files-found: error
